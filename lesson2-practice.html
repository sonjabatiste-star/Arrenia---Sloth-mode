<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 2: Extra Practice &ndash; Fraction on the Number Line</title>
<link rel="stylesheet" href="style.css">
<style>
  .fraction-display {
    text-align:center; font-family: var(--font-display); font-size: 2.1rem; font-weight:700;
    color: var(--marmalade-dark); margin: 6px 0 30px;
  }
  .nl-wrap { padding: 10px 24px 50px; }
  .nl-track {
    position: relative; height: 62px; background: var(--canopy-cream-2);
    border-radius: 16px; border: 2px dashed var(--marmalade);
  }
  .nl-track.drag-over { background: #FFF1DE; }
  .nl-baseline { position:absolute; top:50%; left:14px; right:14px; height:3px; background:var(--bark); transform: translateY(-50%); }
  .nl-tick { position:absolute; top:50%; width:2px; height:14px; background:var(--bark); transform: translate(-1px, -50%); }
  .nl-label { position:absolute; top:calc(50% + 12px); transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.75rem; color: var(--bark-soft); }
  .nl-marker {
    position:absolute; top: 50%; width: 34px; height: 34px; transform: translate(-50%, -50%);
    display:flex; align-items:center; justify-content:center; font-size: 1.4rem; cursor:grab;
  }
  .tray { display:flex; justify-content:center; margin: 14px 0 8px; }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="back-bar">
    <a class="btn btn-outline btn-sm" href="index.html">&larr; Back to Dashboard</a>
  </div>

  <div class="quiz-header">
    <span class="week-eyebrow">Week 2 &middot; Extra Practice</span>
    <h1>📍 Fraction on the Number Line</h1>
  </div>

  <div class="game-card" style="--accent:var(--marmalade);">
    <div class="game-instructions">
      Drag the 🦥 marker onto the number line where you think this fraction belongs. Use the tick marks
      at 0, 1/4, 1/2, 3/4, and 1 to help you estimate. Then hit Check Answer.
    </div>

    <div class="fraction-display" id="fractionLabel">3/4</div>

    <div class="tray">
      <div class="nl-marker" id="marker" draggable="true">🦥</div>
    </div>

    <div class="nl-wrap">
      <div class="nl-track" id="track" ondragover="allowDrop(event)" ondrop="dropMarker(event)">
        <div class="nl-baseline"></div>
        <div class="nl-tick" style="left:0%"></div><div class="nl-label" style="left:0%">0</div>
        <div class="nl-tick" style="left:25%"></div><div class="nl-label" style="left:25%">1/4</div>
        <div class="nl-tick" style="left:50%"></div><div class="nl-label" style="left:50%">1/2</div>
        <div class="nl-tick" style="left:75%"></div><div class="nl-label" style="left:75%">3/4</div>
        <div class="nl-tick" style="left:100%"></div><div class="nl-label" style="left:100%">1</div>
      </div>
    </div>

    <div class="game-controls">
      <button class="btn" id="checkBtn">Check Answer</button>
      <button class="btn btn-outline" id="newBtn">🔄 New Fraction</button>
    </div>
    <p class="game-feedback" id="feedback"></p>
  </div>

</div>

<script src="script.js"></script>
<script>
  const bank = [
    { label: '3/4', value: 0.75 }, { label: '1/3', value: 1/3 },
    { label: '2/3', value: 2/3 },  { label: '1/5', value: 0.2 },
    { label: '3/5', value: 0.6 },  { label: '7/10', value: 0.7 },
    { label: '1/8', value: 0.125 },{ label: '5/8', value: 0.625 },
    { label: '1/10', value: 0.1 }, { label: '9/10', value: 0.9 },
  ];

  let current = null;
  let placedRatio = null;
  const track = document.getElementById('track');
  const marker = document.getElementById('marker');
  const tray = document.querySelector('.tray');

  function newProblem() {
    current = bank[Math.floor(Math.random() * bank.length)];
    document.getElementById('fractionLabel').textContent = current.label;
    placedRatio = null;

    // reset marker back to tray
    marker.style.position = 'static';
    marker.style.left = '';
    marker.style.top = '';
    marker.style.transform = '';
    tray.appendChild(marker);

    document.getElementById('feedback').textContent = '';
    track.style.borderColor = 'var(--marmalade)';
  }

  marker.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', 'marker');
  });

  function allowDrop(e) {
    e.preventDefault();
    track.classList.add('drag-over');
  }

  function dropMarker(e) {
    e.preventDefault();
    track.classList.remove('drag-over');
    const rect = track.getBoundingClientRect();
    let ratio = (e.clientX - rect.left - 14) / (rect.width - 28);
    ratio = Math.max(0, Math.min(1, ratio));
    placedRatio = ratio;

    marker.style.position = 'absolute';
    marker.style.left = (ratio * 100) + '%';
    marker.style.top = '50%';
    marker.style.transform = 'translate(-50%, -50%)';
    track.appendChild(marker);
  }

  document.getElementById('checkBtn').addEventListener('click', () => {
    const feedback = document.getElementById('feedback');
    if (placedRatio === null) {
      feedback.textContent = '🦥 Drag the marker onto the line first.';
      feedback.style.color = 'var(--bark-soft)';
      return;
    }
    const diff = Math.abs(placedRatio - current.value);
    if (diff <= 0.045) {
      feedback.textContent = `🎉 Great estimate! ${current.label} ≈ ${current.value.toFixed(2)}.`;
      feedback.style.color = 'var(--fern-dark)';
      track.style.borderColor = 'var(--fern)';
    } else {
      feedback.textContent = `🍊 Not quite yet — think about which benchmark ${current.label} is nearest to, then try again.`;
      feedback.style.color = 'var(--burnt-clay-dark)';
      track.style.borderColor = 'var(--burnt-clay)';
    }
  });

  document.getElementById('newBtn').addEventListener('click', newProblem);

  newProblem();
</script>
</body>
</html>
